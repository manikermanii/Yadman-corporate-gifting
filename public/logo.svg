<svg xmlns="http://www.w3.org/2000/svg" viewBox="120 40 260 360" width="100%" height="100%">
  <defs>
    <!-- Deep Emerald Gradients matching the official logo -->
    <linearGradient id="emeraldMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#145C47"/>
      <stop offset="50%" stop-color="#0F4C3A"/>
      <stop offset="100%" stop-color="#072F24"/>
    </linearGradient>
    <linearGradient id="emeraldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D735B"/>
      <stop offset="100%" stop-color="#0F4C3A"/>
    </linearGradient>
    <linearGradient id="emeraldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B3C2E"/>
      <stop offset="100%" stop-color="#052018"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C365"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
  </defs>

  <!-- EMBLEM ICON -->
  <g id="yadman-emblem">
    <!-- Top Sprout Leaf & Heart -->
    <!-- Leaf (Left) -->
    <path d="M 242 98 C 242 85 233 72 238 65 C 248 70 254 82 250 96 Z" fill="url(#emeraldLight)"/>
    <path d="M 238 65 C 244 75 244 88 242 98" stroke="#072F24" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    
    <!-- Heart (Right) -->
    <path d="M 264 68 C 260 63 255 64 254 69 C 253 64 248 63 244 68 C 239 74 248 83 254 88 C 260 83 269 74 264 68 Z" fill="url(#emeraldMain)"/>
    
    <!-- Sprout Stem to Ribbon Knot -->
    <path d="M 246 96 Q 248 108 250 114" stroke="#0F4C3A" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Left & Right Wing Hugging Ribbons -->
    <!-- Left Wing Curve -->
    <path d="M 220 228 C 185 224 165 190 168 152 C 170 142 173 134 176 130 C 178 135 180 156 186 170 C 196 194 212 214 235 220 Z" fill="url(#emeraldMain)"/>
    <!-- Right Wing Curve -->
    <path d="M 280 228 C 315 224 335 190 332 152 C 330 142 327 134 324 130 C 322 135 320 156 314 170 C 304 194 288 214 265 220 Z" fill="url(#emeraldDark)"/>

    <!-- Big Top Ribbon Loops (Bow) -->
    <!-- Left Loop -->
    <path d="M 250 116 C 235 90 200 95 190 115 C 182 132 205 148 245 130 Z" fill="url(#emeraldLight)"/>
    <path d="M 243 124 C 218 132 202 122 205 114 C 209 104 230 102 242 118 Z" fill="#FAF8F5" opacity="0.15"/>
    
    <!-- Right Loop -->
    <path d="M 250 116 C 265 90 300 95 310 115 C 318 132 295 148 255 130 Z" fill="url(#emeraldMain)"/>
    <path d="M 257 124 C 282 132 298 122 295 114 C 291 104 270 102 258 118 Z" fill="#072F24" opacity="0.25"/>

    <!-- Center Knot -->
    <circle cx="250" cy="122" r="7" fill="url(#emeraldDark)"/>

    <!-- Gift Box Base Body -->
    <!-- Left Base Half -->
    <path d="M 198 162 L 243 162 L 243 226 C 243 227 210 227 198 221 C 196 216 196 170 198 162 Z" fill="url(#emeraldMain)"/>
    <!-- Left Base Inner Shadow / Bevel -->
    <path d="M 243 162 L 243 226 C 235 226 226 225 220 222 L 220 162 Z" fill="url(#emeraldDark)" opacity="0.35"/>

    <!-- Right Base Half -->
    <path d="M 257 162 L 302 162 C 304 170 304 216 302 221 C 290 227 257 227 257 226 Z" fill="url(#emeraldDark)"/>
    <!-- Right Base Highlight -->
    <path d="M 257 162 L 280 162 L 280 222 C 270 225 262 226 257 226 Z" fill="url(#emeraldLight)" opacity="0.25"/>

    <!-- Vertical Ribbon Center Band -->
    <rect x="243" y="140" width="14" height="87" fill="url(#emeraldLight)"/>
    <line x1="250" y1="140" x2="250" y2="227" stroke="#1D735B" stroke-width="1.5"/>

    <!-- Gift Box Lid -->
    <rect x="186" y="138" width="128" height="24" rx="8" fill="url(#emeraldMain)"/>
    <!-- Lid Horizontal Highlight Top Edge -->
    <path d="M 194 140 L 306 140 C 311 140 313 142 312 145 L 188 145 C 187 142 189 140 194 140 Z" fill="#3AA084" opacity="0.35"/>
    <!-- Lid Center Vertical Ribbon -->
    <rect x="243" y="138" width="14" height="24" fill="url(#emeraldLight)"/>
    <!-- Lid Bottom Bevel/Shadow -->
    <rect x="186" y="158" width="128" height="4" rx="1" fill="#052018" opacity="0.4"/>
  </g>

  <!-- TYPOGRAPHY PART OF THE UNIFIED LOGO -->
  <!-- "YADMAN" Latin Serif -->
  <text x="250" y="285" 
        font-family="'Playfair Display', 'Cinzel', 'Times New Roman', serif" 
        font-size="36" 
        font-weight="800" 
        letter-spacing="8" 
        fill="#0B3C2E" 
        text-anchor="middle">
    YADMAN
  </text>

  <!-- "یادمان" Persian Calligraphy / Naskh-Kufic Hybrid -->
  <text x="250" y="340" 
        font-family="'Vazirmatn', 'IranSans', 'B Titr', Tahoma, sans-serif" 
        font-size="38" 
        font-weight="900" 
        letter-spacing="0.5" 
        fill="#072F24" 
        text-anchor="middle">
    یادمان
  </text>

  <!-- Subtitle "یادمانِ لحظه‌های خاص" -->
  <text x="250" y="380" 
        font-family="'Vazirmatn', 'IranSans', Tahoma, sans-serif" 
        font-size="15" 
        font-weight="600" 
        letter-spacing="0.5" 
        fill="#145C47" 
        text-anchor="middle">
    یادمانِ لحظه‌های خاص
  </text>
</svg>
